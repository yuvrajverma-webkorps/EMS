
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Employee Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <h2>EMS Dashboard</h2>

    <button id="logoutBtn" class="logout-btn">
        Logout
    </button>
</nav>

<main class="dashboard">

    <div class="welcome-card">
        <h1>Employee Management</h1>
        <p>Manage employee records from one place.</p>
    </div>

    <div class="employee-toolbar">
        <h2>Employees</h2>

        <button id="addEmployeeBtn" class="primary-btn">
            + Add Employee
        </button>
    </div>

    <!-- Employee form -->
    <div id="employeeFormContainer" class="form-card hidden">

        <h2 id="employeeFormTitle">Add Employee</h2>

        <form id="employeeForm">

            <input type="hidden" id="employeeId">

            <label>Name</label>
            <input type="text" id="employeeName"
                   placeholder="Enter employee name" required>

            <label>Email</label>
            <input type="email" id="employeeEmail"
                   placeholder="Enter employee email" required>

            <label>Department</label>
            <input type="text" id="employeeDepartment"
                   placeholder="Enter department" required>

            <label>Salary</label>
            <input type="number" id="employeeSalary"
                   placeholder="Enter salary" min="0" step="0.01" required>

            <div class="form-actions">
                <button type="submit" class="primary-btn">Save Employee</button>
                <button type="button" id="cancelEmployeeBtn" class="secondary-btn">
                    Cancel
                </button>
            </div>

        </form>
    </div>

    <p id="employeeMessage"></p>

    <!-- Employee table -->
    <div class="table-container">
        <table class="employee-table">

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="employeeTableBody">
            <tr>
                <td colspan="6">Loading employees...</td>
            </tr>
            </tbody>

        </table>
    </div>

</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
