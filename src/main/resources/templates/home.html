
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Employee Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <h2>EMS Dashboard</h2>

    <button id="logoutBtn" class="logout-btn">
        Logout
    </button>
</nav>

<div class="dashboard">

    <div class="welcome-card">
        <h1>Welcome to Employee Management System!</h1>
        <p id="userEmail">Loading user details...</p>
        <span id="userRole" class="role-badge"></span>
    </div>

    <div class="dashboard-grid">

        <div class="dashboard-card">
            <h3>Authentication</h3>
            <p id="authStatus">Checking...</p>
        </div>

        <div class="dashboard-card">
            <h3>Account Role</h3>
            <p id="roleDisplay">Loading...</p>
        </div>

        <div class="dashboard-card">
            <h3>Employee Management</h3>
            <p>Manage your employee records through protected APIs.</p>
        </div>

    </div>

    <div class="dashboard-card">
        <h3>Server Response</h3>
        <p id="serverResponse">Waiting for server...</p>
    </div>

</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
